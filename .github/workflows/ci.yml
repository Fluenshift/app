name: CI

# Gates of docs/migration/MIGRATION_PROTOCOL.md. Every required check also runs on
# merge_group, or the merge queue waits forever.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DO_NOT_TRACK: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: G1 to G4 (types, lint, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: G2 format
        run: pnpm format

      - name: Documented commands exist
        run: pnpm check:docs

      - name: G11 gate integrity
        run: pnpm check:gates

      - name: G2 lint
        run: pnpm lint

      - name: G2 Effect lint
        run: pnpm lint:effect

      - name: G1 types
        run: pnpm check-types

      - name: G1 Effect diagnostics
        run: pnpm check:effect

      - name: G3 tests
        run: pnpm test

      - name: G4 build
        run: pnpm build

  postgres:
    name: G3 (Postgres integration)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: G3 the Database service against Postgres 17
        env:
          DATABASE_URL: postgres://postgres@localhost:5432/postgres
          DEPLOY_PROFILE: hosted
        run: pnpm test:postgres

  e2e:
    # G4 too: the journeys start the one built process that serves /api/health and the SPA.
    name: G4 and G5 (the built process, end to end)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install the Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: G5 journeys against the built process
        run: pnpm test:e2e

  docker-smoke:
    name: G6 (docker smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: G6 the image of the local profile, published on loopback and run as the caller
        run: pnpm docker:smoke

  parity:
    name: G9 (parity)
    runs-on: ubuntu-24.04
    # The test reports include the Docker smoke, which builds the image.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test reports
        run: node scripts/migration/test-reports.ts reports

      - name: G9 every ledger row valid, every target passing
        run: node scripts/migration/parity-check.ts --reports reports

  red-green:
    name: G8 (red-green)
    # A merge group holds no new unit commits; its skipped run counts as a pass.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    # A Docker smoke target builds the image at its first commit and at the head.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: G8 every target red at its first commit, green at the head
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/migration/red-green.ts --base "$BASE_SHA" --head "$HEAD_SHA"

  gate-selftest:
    name: Gate self-tests
    runs-on: ubuntu-24.04
    # The self-tests start from full test reports, the Docker smoke included.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Clone the baselines at their pins
        run: node scripts/migration/baselines.ts sync

      - name: Every gate rejects its broken case
        run: node scripts/gate-selftest.ts

  migration:
    name: Migration records (pins and inventory)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Baseline tags still resolve to the pins
        run: node scripts/migration/baselines.ts verify

      - name: Clone the baselines at their pins
        run: node scripts/migration/baselines.ts sync

      - name: The inventory reproduces byte for byte
        run: node scripts/migration/inventory.ts --check

      - name: G10 ported tests keep their source's strength
        run: node scripts/migration/parity-audit.ts

  supply-chain:
    name: G7 (secrets and dependencies)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The gitleaks CLI needs no license key; the GitHub Action does in organization repos.
      - name: Secret scan of the whole history
        run: >-
          docker run --rm --volume "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --no-banner --redact

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
